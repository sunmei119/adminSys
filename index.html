<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>桂教通运营管理后台 - 研发文档</title>
<style>
  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-light: #eff6ff;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 24px;
  }
  header { text-align: center; margin-bottom: 48px; }
  header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  header p { color: var(--muted); font-size: 15px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 720px;
  }
  a.card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 28px 24px;
    text-decoration: none;
    color: inherit;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  a.card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 16px rgba(37,99,235,0.10);
  }
  a.card:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .card-icon {
    width: 44px; height: 44px;
    background: var(--accent-light);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .card p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .badge {
    display: inline-block;
    margin-top: 14px;
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-light);
    border-radius: 6px;
    padding: 2px 10px;
    font-weight: 500;
  }
  footer {
    margin-top: 60px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <header>
    <h1>桂教通运营管理后台</h1>
    <p>菜单管理与附件配置模块 · 研发参考文档</p>
  </header>

  <div class="grid">
    <a class="card" href="./prototype/index.html">
      <div class="card-icon">🖥</div>
      <h2>交互原型</h2>
      <p>菜单管理、新增/编辑菜单、选择机构/部门弹窗及附件配置管理的完整交互演示。</p>
      <span class="badge">打开原型</span>
    </a>

    <a class="card" href="./prd/index.html">
      <div class="card-icon">📄</div>
      <h2>产品需求文档 (PRD)</h2>
      <p>功能范围、页面说明、字段规则、附件配置、权限汇总与状态机。</p>
      <span class="badge">阅读 PRD</span>
    </a>
  </div>

  <footer>仅供内部研发参考</footer>
</body>
</html>
